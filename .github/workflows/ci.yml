name: Offline evidence and recovery

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

# No cloud, PAT, model credentials, OIDC, write permissions or external paid checks.
permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      # Public release refs checked against actions/* GitHub git-ref API.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python }}
          check-latest: false
      - name: Install hash-locked tools and local package
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Format
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Strict types
        run: python -m mypy
      - name: Offline Terraform source and IAM policy contract (no provider or AWS calls)
        run: python scripts/check_terraform.py
      - name: Offline tests with complete line and branch evidence
        # All modules remain in the report, including unexecuted PostgreSQL paths.
        # Preserve the original foundation line gate and ingestion/detection branch
        # gates explicitly; new durable coverage is measured in required DB jobs.
        run: python -m pytest --cov=cloudsecops_live --cov-branch --cov-fail-under=0 --cov-report=term-missing --cov-report=json --cov-report=xml
      - name: Foundation line and actual ingestion/detection branch gates
        run: python scripts/check_coverage.py --require-aws
      - name: Secret and private identifier scan (no remote credential verification)
        run: python scripts/check_secrets.py
      - name: Build with locked backend
        run: python -m build --no-isolation
      - name: Install and exercise distributable wheel
        run: |
          python -m venv .wheel-venv
          $wheelPython = if ($IsWindows) { '.wheel-venv/Scripts/python.exe' } else { '.wheel-venv/bin/python' }
          $wheel = @(Get-ChildItem -LiteralPath dist -Filter '*.whl')
          if ($wheel.Count -ne 1) { throw 'Expected exactly one wheel' }
          & $wheelPython -m pip install --require-hashes --only-binary=:all: -r requirements-runtime.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $wheelPython -m pip install --no-deps --no-index $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $wheelPython -I -m cloudsecops_live --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $wheelPython -I -m cloudsecops_live.integrations.aws_cloudtrail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheelCli = if ($IsWindows) { '.wheel-venv/Scripts/cloudsecops-live.exe' } else { '.wheel-venv/bin/cloudsecops-live' }
          & $wheelCli --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $wheelPython -I -c "from importlib.resources import files; from cloudsecops_live.database import LATEST_SCHEMA_VERSION; assert LATEST_SCHEMA_VERSION == 3; root = files('cloudsecops_live'); assert all(root.joinpath(path).is_file() for path in ('sql/001_initial.sql', 'sql/002_workspace.sql', 'sql/003_reviewed_workflow.sql', 'templates/login.html', 'templates/case.html', 'templates/workflow.html', 'templates/workflow_recommendation.html', 'templates/review_queue.html'))"
      - name: Retain sanitized coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: error
          retention-days: 7

  postgres-integration:
    name: PostgreSQL recovery (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python: ["3.12", "3.14"]
    services:
      postgres:
        # Docker Official Image PostgreSQL17.11; reviewed manifest 2026-11-03.
        image: postgres:17.11-alpine3.24@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: cloudsecops_ci
          POSTGRES_DB: cloudsecops_lab
          # Disposable test-only credentials, scoped to this ephemeral runner.
          POSTGRES_PASSWORD: csl-disposable-${{ github.run_id }} # pragma: allowlist secret - disposable CI fixture, no real credential
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --memory=512m --cpus=1 --pids-limit=128
          --health-cmd="pg_isready -h 127.0.0.1 -U cloudsecops_ci -d cloudsecops_lab"
          --health-interval=2s --health-timeout=3s --health-retries=30
    env:
      CSL_TEST_DSN: postgresql://cloudsecops_ci:csl-disposable-${{ github.run_id }}@127.0.0.1:5432/cloudsecops_lab?connect_timeout=5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python }}
          check-latest: false
      - name: Install hash-locked tools and package
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Existing regressions with all-source coverage
        run: python -m pytest --cov=cloudsecops_live --cov-branch --cov-fail-under=0 --cov-report=
      - name: Required migrations, security boundaries, trusted HTTPS and recovery
        env:
          CSL_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python scripts/run_integration.py --receipt .tools/ci-receipts/postgres-py${{ matrix.python }}.json -- --cov=cloudsecops_live --cov-append --cov-branch --cov-fail-under=0 --cov-report=term-missing --cov-report=json --cov-report=xml
      - name: Preserve foundation gates and require actual security branches
        run: python scripts/check_coverage.py --require-durable --require-security --require-aws
      - name: Retain sanitized database test and coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-recovery-py${{ matrix.python }}
          path: |
            coverage.json
            coverage.xml
            .tools/ci-receipts/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  native-terraform:
    name: Native Terraform and provider security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Independent structural source policy
        run: python scripts/check_terraform.py
      - name: Verified native toolchain and configuration gate
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m scripts.terraform_native \
            --source-revision "${{ github.sha }}" \
            --work-parent "${{ runner.temp }}" \
            --receipt .tools/ci-receipts/terraform-native.json
      - name: Retain sanitized native verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terraform-native-${{ github.sha }}
          path: .tools/ci-receipts/terraform-native.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  dependency-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
      - name: Install hash-locked audit tool
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      # Advisory network access only; outages/errors and findings fail this job.
      - name: Audit every pinned development/build dependency
        run: python -m pip_audit --require-hashes --disable-pip -r requirements-dev.lock --strict --progress-spinner off

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "cloudsecops-live"
version = "0.4.0"
description = "Reviewed synthetic investigations with restricted verification and guarded closure"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Farhan Shafee" }]
dependencies = [
  "psycopg[binary]==3.3.7",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "argon2-cffi==25.1.0",
  "Jinja2==3.1.6",
  "cryptography==50.0.2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
cloudsecops-live = "cloudsecops_live.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudsecops_live"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/fixtures", "/docs", "/.github/workflows", "/compose.phase1a2.yml", "/pyproject.toml", "/README.md", "/LICENSE", "/requirements-dev.in", "/requirements-dev.lock", "/requirements-runtime.in", "/requirements-runtime.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
norecursedirs = ["tests/integration"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/cloudsecops_live"]
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["cloudsecops_live"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = false
precision = 2
fail_under = 90
# No source, branch or pragma-based exclusions: security paths count.
exclude_lines = []
partial_branches = []

[tool.coverage.json]
output = "coverage.json"

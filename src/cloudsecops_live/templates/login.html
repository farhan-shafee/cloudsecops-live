{% extends "base.html" %}{% block content %}<main><h2>Sign in</h2>
{% if error %}<p role="alert">Sign-in failed.</p>{% endif %}
<form action="/login" method="post"><input type="hidden" name="csrf_token" value="{{ csrf }}">
<p><label>Username <input name="username" required maxlength="32" autocomplete="username"></label></p>
<p><label>Password <input name="password" type="password" required maxlength="128" autocomplete="current-password"></label></p>
<button type="submit">Sign in</button></form></main>{% endblock %}
